const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "bets-key-" + D.salt;
async function bits(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    {name: "PBKDF2", salt: b64(D.salt), iterations: D.rounds, hash: "SHA-256"}, base, 512));
}
async function show(k) {
  const iv = b64(D.iv), ct = b64(D.ct), msg = new Uint8Array(iv.length + ct.length);
  msg.set(iv); msg.set(ct, iv.length);
  const mk = await crypto.subtle.importKey("raw", k.slice(32), {name: "HMAC", hash: "SHA-256"}, false, ["verify"]);
  if (!await crypto.subtle.verify("HMAC", mk, b64(D.mac), msg)) throw new Error("wrong password");
  const ak = await crypto.subtle.importKey("raw", k.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-CBC", iv}, ak, ct));
  document.open(); document.write(html); document.close();
}
// After load, so document.open() replaces this page instead of appending to it.
window.addEventListener("load", async () => {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) await show(b64(saved));
  } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
});
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Opening…";
  try {
    const k = await bits(document.getElementById("pw").value);
    if (document.getElementById("keep").checked) {
      try { localStorage.setItem(KEY, btoa(String.fromCharCode(...k))); } catch (_) {}
    }
    await show(k);
  } catch (_) { err.textContent = "Wrong password."; }
};
